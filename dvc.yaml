# Reproducible pipeline (template). Run: dvc repro
# Note: text/eval stages need SMS/email data; add them once available.
stages:
  normalize:
    cmd: python scripts/normalize_merge.py --raw data/raw --out data/processed
    deps:
      - scripts/normalize_merge.py
      - data/raw
    outs:
      - data/processed/dataset_url.csv
  train_url:
    cmd: python scripts/train_url_baseline.py --in data/processed/dataset_url.csv --out models/url_rf.joblib
    deps:
      - scripts/train_url_baseline.py
      - data/processed/dataset_url.csv
    outs:
      - models/url_rf.joblib
